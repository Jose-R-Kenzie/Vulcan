name: Vulcan access rules tests

on:
  push:
    branches: [feature/auth-shift-approvals]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  access-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-package-lock
      - run: npm run check:app
      - run: npm run test:schedule
      - run: npx firebase-tools emulators:exec --only database --project demo-vulcan-auth-tests 'npm run test:rules'
